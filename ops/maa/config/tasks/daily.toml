# The daily queue, translated from the GUI config (D:\Projects\MAA\config\gui.new.json.orig, 2026-11-15).
# Roguelike and OperProgress were disabled in the GUI and are left out; UserDataUpdate is a GUI-only feature.

[[tasks]]
name = "开始唤醒"
type = "StartUp"
params = { client_type = "Official", start_game_enabled = true }

[[tasks]]
name = "基建换班"
type = "Infrast"
[tasks.params]
# 2026-11-16: custom two-shift plan for the 333 layout (arknights/analysis optimize.py + make_maa_json.py,
# RIIC evaluator: about 75.3k LMD/day on average). Shift A 00:00-11:59, shift B 12:00-23:59; the runs at 0:00 and
# 8:00 apply A, 12:00 applies B (maa-cli ignores the plan's "period", so the variants below pick plan_index).
# Back to MAA's own algorithm: mode = 0 and drop filename / plan_index / the variants.
mode = 10000
filename = 'D:\Projects\maa-cli\config\infrast\333_两班.json'
plan_index = 0
facility = ["Mfg", "Trade", "Power", "Control", "Reception", "Office", "Dorm", "Processing", "Training", "AssistantChange"]
# drones has no effect with mode = 10000 (MAA docs protocol/integration.md, field drones); the drones that
# actually run are set per shift in the plan file (config/infrast/333_两班.json: plans[].drones = room + index,
# protocol/base-scheduling-schema.md). Kept only so mode 0 would use the trading stations.
drones = "Money"
threshold = 0.3
replenish = true
dorm_notstationed_enabled = true
dorm_trust_enabled = true
reception_message_board = true
reception_clue_exchange = true
reception_send_clue = true
continue_training = false
fiammetta_recovery_enabled = false
use_pinus_sylvestris = false
use_perception_information = false
use_worldly_plight = false
use_abyssal_hunter = false

[[tasks.variants]]
condition = { type = "Time", start = "00:00:00", end = "11:59:59" }
params = { plan_index = 0 }

[[tasks.variants]]
condition = { type = "Time", start = "12:00:00", end = "23:59:59" }
params = { plan_index = 1 }

# >>> annihilation  (annihilation_gate.py comments this block out while the weekly reward is full)
[[tasks]]
name = "剿灭"
type = "Fight"
params = { stage = "Annihilation", medicine = 0, stone = 0, times = 1, series = 0, client_type = "Official" }
# <<< annihilation

# >>> fight  (sanity_plan.py writes the Fight tasks here before each daily run, from ops/maa/sanity_plan.json)
[[tasks]]
name = "理智作战"
type = "Fight"
# 不限次数，把理智打完（times=2 时每次只打两场，12:00 后理智 16:40 左右就满，到 0:00 一直溢出）；
# 只用 2 天内过期的理智药，不动长期的药；不碎石
params = { stage = "TL-7", medicine = 0, medicine_expire_days = 2, stone = 0, series = 0, client_type = "Official" }
# <<< fight

[[tasks]]
name = "自动公招"
type = "Recruit"
[tasks.params]
refresh = true
force_refresh = true
select = [4, 5]
confirm = [3, 4, 5]
level3_recruitment_permit_reserve = 0
times = 4
set_time = true
expedite = false
extra_tags_mode = 0
first_tags = []
preserve_tags = []
skip_robot = false
recruitment_time = { "3" = 540, "4" = 540, "5" = 540, "6" = 540 }

[[tasks]]
name = "信用收支"
type = "Mall"
[tasks.params]
visit_friends = true
shopping = true
buy_first = ["招聘许可"]
blacklist = ["碳", "家具", "加急许可"]
force_shopping_if_credit_full = false
only_buy_discount = false
reserve_max_credit = false
credit_fight = false

# recruit = 限定池活动期间的每日免费单抽：用户自己抽，保持 false（2026-11-15）
# 其余都是免费领取（2026-11-16 打开）：邮件、幸运墙合成玉、限时开采许可、特别访问月卡、活动签到
[[tasks]]
name = "领取奖励"
type = "Award"
params = { award = true, mail = true, recruit = false, orundum = true, mining = true, specialaccess = true, signinevent = true }

# Replaces the GUI's "更新数据" (UserDataUpdate, every run): run.ps1 exports the results to D:\Projects\maa-cli\export
[[tasks]]
name = "仓库识别"
type = "Depot"

[[tasks]]
name = "干员识别"
type = "OperBox"
